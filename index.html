<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Board Game Builder</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="brand">Board Builder</div>
            <div class="actions">
                <button id="btn-projects" class="action-btn" aria-label="Projects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span>My Boards</span>
                </button>
                <button id="btn-print" class="action-btn" aria-label="Print">
                    <img src="asset_icon_print.png" alt="Print">
                    <span>Print Kit</span>
                </button>
            </div>
        </header>

        <!-- Main Controls (Bottom Overlay) -->
        <div class="bottom-controls">
            <div class="instructions">Select a piece to paint on the grid</div>
            
            <div id="tag-filters" class="tag-filters">
                <!-- Tags injected here -->
            </div>

            <div class="palette-dock">
                <button id="new-piece-btn" class="palette-item action-icon" title="Create New Piece">
                    <span>+</span>
                </button>
                <button id="edit-piece-btn" class="palette-item action-icon" title="Edit Selected Piece">
                    <span>✎</span>
                </button>
                <div class="divider"></div>
                <div id="palette-list" class="palette-scroll">
                    <!-- Palette items injected here -->
                </div>
            </div>
        </div>

        <!-- Piece Designer Panel (Bottom Sheet style) -->
        <div id="designer-panel" class="panel">
            <div class="panel-header">
                <h2>Design Piece</h2>
                <button id="close-designer" class="close-btn">×</button>
            </div>
            <div class="panel-content">
                <div class="form-group">
                    <label>Shape</label>
                    <div class="toggle-group">
                        <label class="radio-label">
                            <input type="radio" name="shape" value="square" checked>
                            <span class="box-shape">Square</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="shape" value="circle">
                            <span class="circle-shape">Circle</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Background Style</label>
                    <div class="toggle-group" style="margin-bottom: 12px;">
                        <label class="radio-label">
                            <input type="radio" name="bg-type" value="color" checked>
                            <span class="box-shape">Color</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="bg-type" value="texture">
                            <span class="box-shape">AI Texture</span>
                        </label>
                    </div>

                    <!-- Color Picker Section -->
                    <div id="section-color">
                        <input type="color" id="piece-color" value="#3498db">
                    </div>

                    <!-- Texture Generator Section -->
                    <div id="section-texture" style="display: none;">
                        <div class="texture-input-group">
                            <input type="text" id="texture-prompt" placeholder="e.g. Grass, Stone wall, Lava...">
                            <button id="btn-generate-texture" class="secondary-btn">Generate</button>
                        </div>
                        <div id="texture-preview-area">
                            <!-- Preview image will go here -->
                            <div class="placeholder">No texture generated</div>
                        </div>
                        <div id="texture-loading" style="display: none;">
                            <div class="spinner"></div> Generating...
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Label</label>
                    <input type="text" id="piece-text" placeholder="Start, 1, 2..." maxlength="8">
                </div>

                <div class="form-group">
                    <label>Tag / Category</label>
                    <input type="text" id="piece-tag" placeholder="e.g. Path, Enemy, Decor" list="existing-tags">
                    <datalist id="existing-tags"></datalist>
                </div>

                <button id="add-piece-btn" class="primary-btn">Add to Palette</button>
            </div>
        </div>

    </div>

    <!-- Projects Modal -->
    <div id="projects-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>My Board Games</h2>
                <button id="close-projects" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <div id="projects-list" class="projects-list">
                    <!-- Project items injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-create-project" class="primary-btn">Create New Board</button>
            </div>
        </div>
    </div>

    <!-- Print Container (Hidden until print) -->
    <div id="print-container">
        <div class="print-header">
            <h1>Game Board Kit</h1>
            <p>Cut out these pieces and glue them to a backing board.</p>
        </div>
        
        <div id="print-stats"></div>

        <h2 class="print-section-title">Board Tiles (Real Size)</h2>
        <div id="print-tiles-grid"></div>

        <h2 class="print-section-title break-before">Dice Template</h2>
        <div id="print-dice-area"></div>
    </div>

    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
